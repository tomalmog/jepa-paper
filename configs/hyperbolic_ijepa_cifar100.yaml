# ---------------------------------------------------------------------------
# Hyperbolic-JEPA on CIFAR-100  (single-GPU friendly)
# Based on facebookresearch/ijepa with the loss moved to the Poincaré ball.
# ---------------------------------------------------------------------------

# --- data ---
dataset: cifar100               # "cifar10" or "cifar100"
data_root: ~/data
img_size: 32
patch_size: 4                   # 32/4 = 8×8 = 64 patches per image
num_workers: 4

# --- model ---
encoder: vit_tiny               # "vit_tiny" | "vit_small" | "vit_base"
predictor_embed_dim: 128
predictor_depth: 6
predictor_num_heads: 4

# --- masking (I-JEPA defaults, tuned for an 8×8 grid) ---
enc_mask_scale: [0.85, 1.0]
pred_mask_scale: [0.15, 0.20]
aspect_ratio: [0.75, 1.5]
num_enc_masks: 1
num_pred_masks: 4
min_keep: 4
allow_overlap: false

# --- optimization ---
batch_size: 256
epochs: 300
warmup_epochs: 15
start_lr: 0.0002
lr: 0.001                       # ref_lr
final_lr: 1.0e-6
weight_decay: 0.04
final_weight_decay: 0.4
ema_start: 0.996
ema_end: 1.0
grad_clip: 3.0
amp: true
log_every: 50
save_every: 25

# --- hyperbolic loss (THE ONLY SUBSTANTIVE CHANGE VS I-JEPA) ---
curvature: 1.0                  # c>0; Poincaré ball has sectional curvature -c
clip_radius: 1.0                # Guo et al. 2022 feature-clipping radius
loss_power: 2.0                 # 2 ≈ MSE,  1 ≈ smooth-L1

# --- output ---
output_dir: ./runs/hjepa_cifar100_vit_tiny
