# ---------------------------------------------------------------------------
# Euclidean I-JEPA baseline — SMOKE TEST on MPS.
# Identical twin of `hyperbolic_ijepa_mps_smoke.yaml` with loss_type flipped.
# Runs in ~3-5 min on an M3 Max.
# ---------------------------------------------------------------------------

# --- data ---
dataset: cifar10
data_root: ~/data
img_size: 32
patch_size: 4
num_workers: 2

# --- model ---
encoder: vit_tiny
predictor_embed_dim: 96
predictor_depth: 4
predictor_num_heads: 4

# --- masking ---
enc_mask_scale: [0.85, 1.0]
pred_mask_scale: [0.15, 0.20]
aspect_ratio: [0.75, 1.5]
num_enc_masks: 1
num_pred_masks: 4
min_keep: 4
allow_overlap: false

# --- optimization ---
batch_size: 64
epochs: 3
warmup_epochs: 1
start_lr: 0.0002
lr: 0.001
final_lr: 1.0e-6
weight_decay: 0.04
final_weight_decay: 0.04
ema_start: 0.996
ema_end: 1.0
grad_clip: 3.0
amp: false
log_every: 20
save_every: 1

# --- loss ---
loss_type: euclidean
curvature: 1.0                  # ignored when loss_type=euclidean
clip_radius: 1.0                # ignored when loss_type=euclidean
loss_power: 2.0

output_dir: ./runs/eijepa_mps_smoke
