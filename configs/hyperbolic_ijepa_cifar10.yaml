# Hyperbolic-JEPA on CIFAR-10 (for quick iteration / sanity checks)
dataset: cifar10
data_root: ~/data
img_size: 32
patch_size: 4
num_workers: 4

encoder: vit_tiny
predictor_embed_dim: 128
predictor_depth: 6
predictor_num_heads: 4

enc_mask_scale: [0.85, 1.0]
pred_mask_scale: [0.15, 0.20]
aspect_ratio: [0.75, 1.5]
num_enc_masks: 1
num_pred_masks: 4
min_keep: 4
allow_overlap: false

batch_size: 256
epochs: 200
warmup_epochs: 10
start_lr: 0.0002
lr: 0.001
final_lr: 1.0e-6
weight_decay: 0.04
final_weight_decay: 0.4
ema_start: 0.996
ema_end: 1.0
grad_clip: 3.0
amp: true
log_every: 50
save_every: 20

curvature: 1.0
clip_radius: 1.0
loss_power: 2.0

output_dir: ./runs/hjepa_cifar10_vit_tiny
