# ---------------------------------------------------------------------------
# Euclidean I-JEPA baseline — identical twin of `hyperbolic_ijepa_mps.yaml`
# but with the regression loss swapped back to the original I-JEPA recipe:
#
#     loss = mean(|pred - target|^p) / p
#
# Use this to produce the apples-to-apples A/B number against the Poincaré
# loss. Every other knob (data, arch, masking, schedules, batch size,
# epochs, lr, wd, ema, grad_clip) is held constant — only `loss_type` moves.
#
# Expected wall-clock on an Apple M3 Max: ~2-4 hours (same as hyperbolic).
# ---------------------------------------------------------------------------

# --- data ---
dataset: cifar10
data_root: ~/data
img_size: 32
patch_size: 4
num_workers: 2

# --- model ---
encoder: vit_tiny
predictor_embed_dim: 96
predictor_depth: 4
predictor_num_heads: 4

# --- masking ---
enc_mask_scale: [0.85, 1.0]
pred_mask_scale: [0.15, 0.20]
aspect_ratio: [0.75, 1.5]
num_enc_masks: 1
num_pred_masks: 4
min_keep: 4
allow_overlap: false

# --- optimization ---
batch_size: 128
epochs: 50
warmup_epochs: 3
start_lr: 0.0002
lr: 0.0008
final_lr: 1.0e-6
weight_decay: 0.04
final_weight_decay: 0.2
ema_start: 0.996
ema_end: 1.0
grad_clip: 3.0
amp: false
log_every: 50
save_every: 5

# --- loss ---
loss_type: euclidean            # <-- the only meaningful difference vs. the hyperbolic config
# `curvature` and `clip_radius` are ignored when loss_type=euclidean.
# Kept here for schema symmetry so both configs share the same keys.
curvature: 1.0
clip_radius: 1.0
loss_power: 2.0                 # half-MSE; the original paper uses 1.0, but
                                # we pick 2.0 here to match the squared Poincaré
                                # distance used in the hyperbolic config — this
                                # isolates "where the loss is measured" from
                                # "shape of the loss function" in the A/B.

output_dir: ./runs/eijepa_mps_cifar10
