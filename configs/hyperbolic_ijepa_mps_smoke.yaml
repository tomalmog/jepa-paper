# ---------------------------------------------------------------------------
# Hyperbolic-JEPA  —  SMOKE TEST on Apple Silicon (MPS)
# Target: verify the full training loop works end-to-end in ~3-5 minutes
# Hardware tested: Apple M3 Max, 36 GB unified memory
# ---------------------------------------------------------------------------

# --- data ---
dataset: cifar10                # smaller & faster to iterate than cifar100
data_root: ~/data
img_size: 32
patch_size: 4                   # 32/4 = 8x8 = 64 patches per image
num_workers: 2                  # macOS fork-safe; don't push this high

# --- model ---
encoder: vit_tiny               # ~5.5M params
predictor_embed_dim: 96         # shrunk vs. the A100 config (was 128)
predictor_depth: 4              # shrunk vs. the A100 config (was 6)
predictor_num_heads: 4

# --- masking (I-JEPA defaults, tuned for an 8x8 grid) ---
enc_mask_scale: [0.85, 1.0]
pred_mask_scale: [0.15, 0.20]
aspect_ratio: [0.75, 1.5]
num_enc_masks: 1
num_pred_masks: 4
min_keep: 4
allow_overlap: false

# --- optimization ---
batch_size: 64                  # small so a few iters per epoch on MPS
epochs: 3                       # just enough to confirm loss goes down
warmup_epochs: 1
start_lr: 0.0002
lr: 0.001                       # ref_lr
final_lr: 1.0e-6
weight_decay: 0.04
final_weight_decay: 0.04        # don't bother ramping for a smoke test
ema_start: 0.996
ema_end: 1.0
grad_clip: 3.0
amp: false                      # AMP only runs on CUDA; this is a hint
log_every: 20
save_every: 1

# --- loss ---
loss_type: poincare             # 'poincare' (hyperbolic) | 'euclidean' (baseline)
curvature: 1.0
clip_radius: 1.0
loss_power: 2.0

output_dir: ./runs/hjepa_mps_smoke
