# Tier 1.5: Model A + ambient SIGReg + BN projector (Tiny-ImageNet, 600 ep, ViT-Small)
# Uses the low SIGReg weight that stabilized the ViT-Tiny ambient baseline.
dataset: tiny_imagenet
data_root: ~/data
img_size: 64
patch_size: 8
num_workers: 4

encoder: vit_small
predictor_embed_dim: 192
predictor_depth: 4
predictor_num_heads: 4

enc_mask_scale: [0.85, 1.0]
pred_mask_scale: [0.15, 0.20]
aspect_ratio: [0.75, 1.5]
num_enc_masks: 1
num_pred_masks: 4
min_keep: 4
allow_overlap: false

batch_size: 256
epochs: 600
warmup_epochs: 30
start_lr: 0.0002
lr: 0.001
final_lr: 1.0e-6
weight_decay: 0.04
final_weight_decay: 0.4
ema_start: 0.996
ema_end: 1.0
grad_clip: 3.0
amp: true
log_every: 50
save_every: 600

loss_type: euclidean
loss_power: 2.0

projector: true

sigreg: true
sigreg_mode: ambient
sigreg_num_slices: 256
sigreg_t_max: 3.0
sigreg_n_points: 17
sigreg_weight: 0.01

output_dir: ./runs/tin_600ep_vits_a_sigreg_proj
